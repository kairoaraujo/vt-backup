name: Zizmor

# Static analysis of the GitHub Actions workflows themselves.
# https://docs.zizmor.sh/
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload findings to the Security tab as code scanning alerts.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .
          persona: regular
          # Upload SARIF results to the Security tab (works on public repos /
          # repos with GitHub Advanced Security).
          advanced-security: "true"
